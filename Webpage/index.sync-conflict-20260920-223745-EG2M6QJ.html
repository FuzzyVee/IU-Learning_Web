<!Doctype html>

<html lang="es">

<head>
	<!-- TODO: Remove before showing, teacher doesnt like it -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="styles.css">
	<script type="text/javascript" src="./Core/Validations_Class.js"></script>
	<script type="text/javascript" src="./Core/Dom_Class.js"></script>
	<script type="text/javascript" src="./app/persona_Class.js"></script>
</head>

<header id="header" class="header">
<h1>GESTION DE ENTIDAD</h1>
<div id="clock">--:--:--</div>
</header>

<body>
	<header>
		<h1>Gestión de Interfaces de Usuario</h1>	</header>
	<aside id="div-menu">
		<nav>
            <a href="#" class="nav-link" onclick="menu_work(); entidad = new persona(); entidad.dom.show_element('IU_form');">Gestión Persona</a>
		</nav>
	</aside>
	<section id="IU_form">
		<article>
			<h2>Alta de Persona</h2>
			<form id="form_persona" action="http://193.147.87.202/procesaform.php" method="POST"
enctype="multipart/form-data" onsubmit="if (typeof entidad.ADD_submit_persona() === 'object') {return false} else {return true};">

				<!-- DNI -->
				<label for="dni">DNI:</label>
				<input type="text" id="dni" name="dni" onblur="return entidad.ADD_dni_validation();">
				<span id="error_dni" class="error_span"></span>
				<br><br>

				<!-- Nombre -->
				<label for="nombre_persona">Nombre:</label>
				<input type="text" id="nombre_persona" name="nombre_persona"
					onblur="validarCampoPersona('nombre_persona');">
				<span id="error_nombre_persona" class="error_span"></span>
				<br><br>

				<!-- Apellidos -->
				<label for="apellidos_persona">Apellidos:</label>
				<input type="text" id="apellidos_persona" name="apellidos_persona"
					onblur="validarCampoPersona('apellidos_persona');">
				<span id="error_apellidos_persona" class="error_span"></span>
				<br><br>

				<!-- Fecha de Nacimiento -->
				<label for="fechaNacimiento_persona">Fecha Nacimiento:</label>
				<input type="date" id="fechaNacimiento_persona" name="fechaNacimiento_persona"
					onchange="validarCampoPersona('fechaNacimiento_persona');">
				<span id="error_fechaNacimiento_persona" class="error_span"></span>
				<br><br>

				<!-- Dirección -->
				<label for="direccion_persona">Dirección:</label>
				<input type="text" id="direccion_persona" name="direccion_persona"
					onblur="validarCampoPersona('direccion_persona');">
				<span id="error_direccion_persona" class="error_span"></span>
				<br><br>

				<!-- Teléfono -->
				<label for="telefono_persona">Teléfono:</label>
				<input type="text" id="telefono_persona" name="telefono_persona"
					onblur="validarCampoPersona('telefono_persona');">
				<span id="error_telefono_persona" class="error_span"></span>
				<br><br>

				<!-- Email -->
				<label for="email_persona">Email:</label>
				<input type="email" id="email_persona" name="email_persona"
					onblur="validarCampoPersona('email_persona');">
				<span id="error_email_persona" class="error_span"></span>
				<br><br>

				<!-- Foto -->
				<label for="foto_persona">Foto:</label>
				<input type="file" id="foto_persona" name="foto_persona"
					onchange="validarCampoPersona('foto_persona');">
				<span id="error_foto_persona" class="error_span"></span>
				<br><br>

				<button type="submit">Enviar Persona</button>
			</form>
		</article>
	</section>
</body>
<script src="./app.js"></script>

</html>
