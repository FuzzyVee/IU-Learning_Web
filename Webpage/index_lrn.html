<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gestión de Persona</title>
	<link rel="stylesheet" href="styles.css">

	<script type="text/javascript" src="./Core/Validations_Class.js"></script>
	<script type="text/javascript" src="./Core/Dom_table_Class.js"></script>
	<script type="text/javascript" src="./Core/Dom_Class.js"></script>
	<script type="text/javascript" src="./app/persona_Class.js"></script>
</head>

<body>
	<header id="header" class="header">
		<h1>GESTIÓN DE ENTIDAD</h1>
		<div id="clock">--:--:--</div>
	</header>

	<aside>
		<nav>
			<a href="#" class="nav-link" onclick="menu_work();">Gestión Persona</a>
		</nav>
	</aside>

	<section id="IU_form">
		<article>
			<h2>Alta de Persona</h2>
			<form action="http://193.147.87.202/procesaform.php" method="POST" enctype="multipart/form-data" 
				onsubmit="if (typeof entidad.ADD_submit_persona() === 'object') { return false; } else { return true; }">

				<!-- DNI -->
				<div class="form-group">
					<label for="dni">DNI:</label>
					<input type="text" id="dni" name="dni" onblur="return entidad.ADD_dni_validation();">
					<span id="span_error_dni" style="display: none;">
						<span id="error_dni" class="error_span"></span>
					</span>
				</div>

				<!-- Nombre -->
				<div class="form-group">
					<label for="nombre_persona">Nombre:</label>
					<input type="text" id="nombre_persona" name="nombre_persona" onblur="return entidad.ADD_nombre_persona_validation();">
					<span id="span_error_nombre_persona" style="display: none;">
						<span id="error_nombre_persona" class="error_span"></span>
					</span>
				</div>

				<!-- Apellidos -->
				<div class="form-group">
					<label for="apellidos_persona">Apellidos:</label>
					<input type="text" id="apellidos_persona" name="apellidos_persona" onblur="return entidad.ADD_apellidos_persona_validation();">
					<span id="span_error_apellidos_persona" style="display: none;">
						<span id="error_apellidos_persona" class="error_span"></span>
					</span>
				</div>

				<!-- Fecha de Nacimiento (Calendar Enabled) -->
				<div class="form-group">
					<label for="fechaNacimiento_persona">Fecha Nacimiento:</label>
					<input type="date" id="fechaNacimiento_persona" name="fechaNacimiento_persona" onchange="return entidad.ADD_fechaNacimiento_persona_validation();">
					<span id="span_error_fechaNacimiento_persona" style="display: none;">
						<span id="error_fechaNacimiento_persona" class="error_span"></span>
					</span>
				</div>

				<!-- Dirección -->
				<div class="form-group">
					<label for="direccion_persona">Dirección:</label>
					<input type="text" id="direccion_persona" name="direccion_persona" onblur="return entidad.ADD_direccion_persona_validation();">
					<span id="span_error_direccion_persona" style="display: none;">
						<span id="error_direccion_persona" class="error_span"></span>
					</span>
				</div>

				<!-- Teléfono -->
				<div class="form-group">
					<label for="telefono_persona">Teléfono:</label>
					<input type="text" id="telefono_persona" name="telefono_persona" onblur="return entidad.ADD_telefono_persona_validation();">
					<span id="span_error_telefono_persona" style="display: none;">
						<span id="error_telefono_persona" class="error_span"></span>
					</span>
				</div>

				<!-- Email -->
				<div class="form-group">
					<label for="email_persona">Email:</label>
					<input type="email" id="email_persona" name="email_persona" onblur="return entidad.ADD_email_persona_validation();">
					<span id="span_error_email_persona" style="display: none;">
						<span id="error_email_persona" class="error_span"></span>
					</span>
				</div>

				<!-- Foto -->
				<div class="form-group">
					<label for="foto_persona">Foto:</label>
					<input type="file" id="foto_persona" name="foto_persona" onchange="return entidad.ADD_foto_persona_validation();">
					<span id="span_error_foto_persona" style="display: none;">
						<span id="error_foto_persona" class="error_span"></span>
					</span>
				</div>

				<button type="submit" id="submit_button">Enviar Persona</button>
			</form>
		</article>
	</section>

	<footer>
		<p>Interfaces de Usuario - Curso 2026-2027</p>
	</footer>

	<script src="./app.js"></script>
</body>

</html>
